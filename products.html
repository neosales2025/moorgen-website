<!DOCTYPE html>

  <script src="main.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFFFF;
      --bg-alt: #F4F3EF;
      --text: #111111;
      --muted: #6B6A62;
      --gold: #9D9E9E;
      --line: rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

 header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 1.5rem 3rem;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .logo-link {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  text-decoration: none;
  z-index: 1;
}

.logo {
  height: 30px;
  width: auto;
  display: block;
}

    nav { display: flex; gap: 2rem; }
    nav a {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: var(--text); }

    /* Mobile nav toggle — needed now that the logo is centered: below
       ~1320px the nav no longer has room beside it and must collapse
       into an off-canvas menu instead of overlapping the logo. */
    .nav-toggle {
      display: none;
      width: 34px; height: 22px;
      position: relative;
      background: none; border: none; cursor: pointer;
      z-index: 2;
    }
    .nav-toggle span, .nav-toggle span::before, .nav-toggle span::after {
      content: ""; position: absolute; left: 0; right: 0; height: 1.5px; background: var(--black);
      transition: transform 0.3s var(--ease-lux), opacity 0.3s ease, top 0.3s var(--ease-lux);
    }
    .nav-toggle span { top: 10px; }
    .nav-toggle span::before { top: -8px; }
    .nav-toggle span::after { top: 8px; }
    body.nav-open .nav-toggle span { background: transparent; }
    body.nav-open .nav-toggle span::before { top: 0; transform: rotate(45deg); background: var(--black); }
    body.nav-open .nav-toggle span::after { top: 0; transform: rotate(-45deg); background: var(--black); }

    @media (max-width: 1320px) {
      .nav-toggle { display: block; }
      nav {
        /* Explicit vw/vh instead of inset:0 — this header has
           backdrop-filter, which makes it a containing block for
           fixed-position descendants; inset:0 would then resolve
           against the header's own ~70px height instead of the
           viewport. vh/vw units always resolve against the true
           viewport regardless of that. */
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        flex-direction: column; justify-content: center; align-items: flex-start;
        gap: 1.8rem;
        padding: 0 32px;
        background: var(--white);
        transform: translateX(100%);
        transition: transform 0.5s var(--ease-lux);
        z-index: 610;
      }
      body.nav-open nav { transform: translateX(0); }
      nav a { font-size: 1.5rem; color: var(--black); }
    }

  </style>
</head>
<body>

  <!-- =====================================================================
       ANIMATION LIBRARIES for the Product Showcase section. All deferred,
       so they execute in this exact document order — after main.js, after
       parsing, without blocking the page — and showcase.js can rely on
       gsap/ScrollTrigger/SplitType/Lenis being defined by the time it runs.
       If any fail to load (offline, blocked CDN), showcase.js falls back
       to a static, fully-visible first product — see the hasGSAP/hasST/
       hasSplit/hasLenis guards inside it.
       ===================================================================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://unpkg.com/split-type" defer></script>
  <script src="https://unpkg.com/lenis/dist/lenis.min.js" defer></script>
  <script src="showcase.js" defer></script>
